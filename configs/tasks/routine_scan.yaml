# Task: Routine Scan
# ==================
# Periodic market data check by Market Analyst.

id: routine_scan
agent: market_analyst
inference_tier: 1

inputs:
  - source: sqlite
    query: "SELECT * FROM pool_metrics WHERE timestamp > strftime('%s', 'now') - 1800"
    name: recent_metrics
  - source: vault
    path: knowledge/active-pools.md
    name: pool_knowledge

outputs:
  - type: vault_update
    path: knowledge/active-pools.md
    condition: new_information_found
  - type: proposal
    condition: actionable_opportunity_detected
    requires_consensus_from:
      - bot_analyst
  - type: metric
    table: agent_activity
    fields:
      - agent
      - task
      - duration_ms
      - tokens_used
      - findings_count

prompt_template: |
  You are the Market Analyst. Review the latest pool metrics and update
  your knowledge base. If you find a significant opportunity or risk,
  create a proposal.

  ## Current Knowledge
  {pool_knowledge}

  ## Latest Metrics (last 30 minutes)
  {recent_metrics}

  ## Instructions
  1. Compare metrics to your existing knowledge
  2. Note any significant changes (volume spikes, new competitors, spread changes)
  3. If knowledge needs updating, output a VAULT_UPDATE block
  4. If action is needed, output a PROPOSAL block
  5. Otherwise, output a brief SUMMARY block

  ## Output Format
  Respond with one or more of these blocks:

  ```VAULT_UPDATE
  path: knowledge/active-pools.md
  content: |
    <updated markdown content>
  ```

  ```PROPOSAL
  title: <proposal title>
  requires_consensus_from: [bot_analyst]
  content: |
    <proposal markdown>
  ```

  ```SUMMARY
  <brief summary of findings>
  ```
