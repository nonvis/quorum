# Quorum Daemon Configuration
# ============================

daemon:
  pid_file: /tmp/quorum.pid
  data_dir: ./data
  log_level: info               # debug | info | warn | error

chain:
  network: testnet              # testnet | mainnet
  rpc_url: https://fullnode.testnet.sui.io:443
  package_id: "0x0"             # Set after contract deployment
  gas_budget: 100000000

walrus:
  aggregator_url: https://aggregator.walrus-testnet.walrus.space
  publisher_url: https://publisher.walrus-testnet.walrus.space
  enabled: false                # Enable after Phase 2

seal:
  enabled: false                # Enable after Phase 3

inference:
  # Tier 1: Local LLM
  local:
    enabled: false              # Enable after Phase 4
    url: http://localhost:11434  # Ollama default
    model: llama3.1:8b
    timeout_seconds: 30

  # Tier 2: Frontier model
  frontier:
    provider: anthropic         # anthropic | openai
    model: claude-sonnet-4-5-20250929
    api_key_env: ANTHROPIC_API_KEY  # Read from environment variable
    timeout_seconds: 60
    max_tokens: 4096

consensus:
  max_rounds: 3
  round_timeout_seconds: 7200   # 2 hours per round
  human_escalation: true

agents:
  - config: configs/agents/market_analyst.yaml
  - config: configs/agents/bot_analyst.yaml
  - config: configs/agents/engineer.yaml
  - config: configs/agents/operator.yaml
