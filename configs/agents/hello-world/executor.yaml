# Agent: Executor
# ===============
# Implements approved proposals with full tool access.
# Runs in target_dir, writes code, compiles, tests.

id: executor
agent_class: executor
name: "Executor"
role: doer
description: "Implements proposals — full tool access, writes and tests code"

vault_path: data/vaults/executor/
context_file: data/vaults/executor/CONTEXT.md

context_budget:
  max_vault_files: 5
  max_vault_tokens: 10000
  always_include:
    - CONTEXT.md
