# Agent: Engineer
# ===============
# Designs and implements code changes safely.
# Looks at CODE — architecture, latency, safety rails.

id: engineer
agent_class: analyst    # analyst = read-only tools, no Write/Edit/NotebookEdit
name: "Engineer"
description: "Implementation — C++ architecture, safety, code quality"

vault_path: data/vaults/engineer/
context_file: data/vaults/engineer/CONTEXT.md

schedule:
  - type: periodic
    interval_minutes: 1440
    task: codebase_review

triggers:
  - event: proposal_needs_review
    task: feasibility_review
  - event: bug_report
    task: diagnosis

inference_tier:
  codebase_review: 2
  feasibility_review: 2
  diagnosis: 2

context_budget:
  max_vault_files: 25
  max_vault_tokens: 80000
  always_include:
    - CONTEXT.md
    - knowledge/architecture.md
  prefer_recent: true

boundaries:
  can_do:
    - Review and write C++ code
    - Design system architecture
    - Assess safety of proposed changes
    - Write implementation plans
  cannot_do:
    - Evaluate P&L or trading performance
    - Discover market opportunities
    - Manage deployments or processes
    - Make trading decisions
