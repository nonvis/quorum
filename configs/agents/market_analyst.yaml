# Agent: Market Analyst
# =====================
# Discovers and evaluates MM opportunities in DeFi markets.
# Looks OUTWARD — pools, competitors, macro signals.

id: market_analyst
name: "Market Analyst"
description: "External market analysis — pools, competitors, macro signals"

vault_path: data/vaults/market_analyst/
context_file: data/vaults/market_analyst/CONTEXT.md

schedule:
  - type: periodic
    interval_minutes: 30
    task: routine_scan
  - type: periodic
    interval_minutes: 1440      # 24 hours
    task: deep_analysis

triggers:
  - event: new_pool_detected
    task: pool_evaluation
  - event: competitor_activity
    task: competitor_analysis

inference_tier:
  routine_scan: 1               # local LLM
  deep_analysis: 2              # frontier model
  pool_evaluation: 2            # frontier model
  competitor_analysis: 1        # local LLM

context_budget:
  max_vault_files: 20
  max_vault_tokens: 50000
  always_include:
    - CONTEXT.md
    - knowledge/active-pools.md
  prefer_recent: true

boundaries:
  can_do:
    - Analyze pool metrics and volume
    - Evaluate competitor spread patterns
    - Write opportunity assessments
    - Propose new pool investigations
  cannot_do:
    - Write or modify C++ code
    - Manage processes or deployments
    - Tune bot parameters
    - Execute trades
