# Quorum Daemon Configuration
# ============================

daemon:
  pid_file: /tmp/quorum.pid
  data_dir: ./data
  log_level: info               # debug | info | warn | error

chain:
  network: testnet              # testnet | mainnet
  rpc_url: https://fullnode.testnet.sui.io:443
  package_id: "0x0"             # Set after contract deployment
  gas_budget: 100000000

walrus:
  aggregator_url: https://aggregator.walrus-testnet.walrus.space
  publisher_url: https://publisher.walrus-testnet.walrus.space
  enabled: false                # Enable after Phase 2

seal:
  enabled: false                # Enable after Phase 3

inference:
  # Tier 1: Local LLM
  local:
    enabled: false              # Enable after Phase 4
    url: http://localhost:11434  # Ollama default
    model: llama3.1:8b
    timeout_seconds: 30

  # Tier 2: Frontier model
  frontier:
    provider: anthropic         # anthropic | openai
    model: claude-sonnet-4-5-20250929
    api_key_env: ANTHROPIC_API_KEY  # Read from environment variable
    timeout_seconds: 60
    max_tokens: 4096

consensus:
  max_rounds: 3
  round_timeout_seconds: 7200   # 2 hours per round
  human_escalation: true

budget:
  # Sequential execution enforced — one task at a time, always.
  # No max_concurrent setting. This is a design decision, not a configuration.
  daily_limit_usd: 10.0         # pause dispatch when exceeded
  hourly_limit_usd: 3.0         # pause dispatch when exceeded
  task_timeout_seconds: 300     # kill claude -p after 5 minutes

conversations:
  enabled: true
  default_max_rounds: 3           # max T->R revision cycles per conversation
  default_budget_usd: 5.0         # per-conversation budget cap
  human_gate: true                # require operator approval before executor (Phase 0.9)
  pipeline: analyst
  thinker: market_analyst
  reviewer: bot_analyst

# Execution modes:
#   Task Queue   — operator seeds tasks, agents execute (Phase 0.5)
#   Conversation — daemon seeds tasks from goal, T/D/R pipeline (Phase 0.7)
# See: 01_Projects/Quorum/12 - Execution Modes.md

agents:
  - config: configs/agents/mm-bot/market_analyst.yaml
  - config: configs/agents/mm-bot/bot_analyst.yaml
  - config: configs/agents/mm-bot/engineer.yaml
  - config: configs/agents/mm-bot/operator.yaml
